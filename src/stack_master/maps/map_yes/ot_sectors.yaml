ot_interpolator:
  ros__parameters:
    n_sectors: 3
    yeet_factor: 1.25
    spline_len: 30
    Overtaking_sector0:
      start: 0
      end: 114
      ot_flag: true
    # Which way to take an overtake in this sector: left | right | auto.
    #
    # auto is the planner's own room comparison, which picks whichever side has
    # more room at its tightest point - on a corner that is the outside, every
    # time. It also re-decides every tick off the opponent's measured edge,
    # which wanders about 10 cm frame to frame, so when the two sides are close
    # the answer flips and an overtake is started and abandoned repeatedly.
    #
    # Naming the side here makes it a policy instead. Safety is unchanged: the
    # planner still refuses any side that does not clear every obstacle, and
    # falls back to the roomier one when the named side is not available.
      preferred_side: auto
    Overtaking_sector1:
      start: 115
      end: 169
      ot_flag: true
      preferred_side: auto
    Overtaking_sector2:
      start: 170
      end: 349
      ot_flag: true
      preferred_side: auto
