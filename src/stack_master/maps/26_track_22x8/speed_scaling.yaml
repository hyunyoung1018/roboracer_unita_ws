sector_tuner:
  ros__parameters:
    # Ceiling. `scaling` below is clipped to this, so this is what
    # caps autonomous speed no matter what is set live.
    global_limit: 1.0
    n_sectors: 1
    Sector0:
      start: 0
      end: 422
      # Live knob, raise toward global_limit as the line proves out:
      #   ros2 param set /sector_tuner Sector0.scaling 0.8
      scaling: 0.5
      only_FTG: false
      no_FTG: false
