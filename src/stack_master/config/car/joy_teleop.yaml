# Logitech F710 wireless gamepad -> AckermannDriveStamped.
#
# Put the F710's mode switch on X (XInput). In D mode the axis and button
# numbering differs and every mapping below is wrong.
#
# Axis and button indices are for XInput on Linux:
#   axis 1  left stick  vertical    -> speed
#   axis 3  right stick horizontal  -> steering
#   button 0  A    deadman, constant mapping speed
#   button 4  LB   deadman, stick speed
#   button 5  RB   hand back to autonomous
#
# Deadman is not optional. Without a held button the car keeps the last
# command when the joystick drops out - and this one is wireless.

joy:
  ros__parameters:
    device_id: 0
    deadzone: 0.01
    # deadzone: 0.05
    # Republish the current stick position even when nothing moves, so a held
    # deadman keeps producing commands instead of timing out.
    autorepeat_rate: 20.0
    coalesce_interval: 0.01

joy_teleop:
  ros__parameters:
    # There is deliberately no always-on "default" entry publishing zeros.
    # race_stack has one, but joy_teleop 1.6 (what apt ships) rejects any
    # command without deadman_buttons or deadman_axes and refuses to start:
    # "No buttons or axes configured for command 'default'".
    #
    # Releasing the deadman therefore stops publication rather than publishing a
    # stop. That is safe, and it is what stops the car: with no new command,
    # ackermann_to_vesc sends nothing, and the VESC's own command timeout
    # (App Settings -> General) cuts the motor. Check that timeout is set before
    # relying on it.

    # Hold LB to drive.
    human_control:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: teleop
      deadman_buttons: [4]
      axis_mappings:
        drive-speed:
          axis: 1
          # [m/s] at full stick, proportional below that. Well under the VESC's
          # own limit: at speed_to_erpm_gain 4425 this asks for 22k ERPM against
          # a speed_max of 69k. Drive mapping laps on part throttle - cartographer
          # wants a slow steady pass - and keep the rest for getting back to the
          # start line.
          scale: 5.0
          offset: 0.0
        drive-steering_angle:
          axis: 3
          # [rad] at full stick. The car's measured limit - full stick now
          # reaches the servo limit exactly instead of being clipped short of
          # it, which is what made the last fifth of stick travel dead.
          scale: 0.2954
          offset: 0.0

    # Hold RB to map: constant speed, steering still yours.
    #
    # Mapping wants an even pass, and a thumb on a stick does not give one.
    # Speed sags in the corners, which is exactly where cartographer is
    # working hardest, and the VESC is worst: it is sensorless, so below the
    # openloop threshold of 1200 ERPM - about 0.28 m/s - the flux observer is
    # not trusted and the controller drives the field blind. Creeping through
    # a turn crosses that line.
    #
    # 0.8 m/s is three times the openloop floor and still walking pace, so
    # the motor stays observed the whole way round while the scan matcher
    # gets a constant translation to work with.
    #
    # scale 0.0 with an offset is how joy_teleop expresses a constant: it
    # computes axes[axis] * scale + offset, so the stick is read and then
    # multiplied away. The axis still has to name a real one.
    #
    # Do not hold RB and LB together - both commands publish to the same topic
    # and they will fight.
    mapping_control:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: teleop
      deadman_buttons: [5]
      axis_mappings:
        drive-speed:
          axis: 1
          scale: 0.0
          offset: 0.8
        drive-steering_angle:
          axis: 3
          scale: 0.2954
          offset: 0.0

    # RB is reserved as the autonomous-handover button. It publishes nowhere
    # until the controller and the command mux exist; kept so the button
    # assignment does not move later.
    autonomous_control:
      type: topic
      interface_type: std_msgs/msg/Int8
      topic_name: /dev/null
      deadman_buttons: [5]
      message_value:
        data:
          value: 0
