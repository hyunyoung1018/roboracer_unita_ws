detect:
  # ros__parameters, two underscores. With one, the node matches nothing in
  # this file and silently falls back to its code defaults - no error, no
  # warning, and editing anything here does nothing.
  ros__parameters:
    # [Hz] Detection frequency.
    #
    # 20 because the python detector could not hold 40: it did L-shape
    # rectangle fitting in python on every tick, the jetson saturated, and /tf
    # reached the detector a full second late, which put every obstacle a metre
    # or two behind where it really was.
    #
    # The detector is C++ now and that constraint is probably gone, but it has
    # not been measured. 20 Hz is 50 ms between updates on obstacles that do
    # not move, approached at under 3 m/s - 15 cm of travel - so there is no
    # symptom pushing this up. Before raising it, measure:
    #
    #   ros2 param set /detect measure true
    #   ros2 topic echo /detect/latency
    #
    # That is now seconds per tick, not a rate. Anything near the tick period
    # means the timer cannot keep up. Watch for the "placing obstacles with a
    # X s old transform" warning at the same time - that is the symptom that
    # made this 20 in the first place.
    rate_detect: 20.0

    # Which question is asked of every lidar return.
    #
    #   grid   - look it up in the eroded map image. One array lookup, no
    #            waypoint, no coordinate transform. Removes a whole class of
    #            failure: the alternative has to assign the return to a
    #            waypoint first, and where the track doubles back it can pick
    #            the wrong branch. It also stops the track boundary being a
    #            proxy - an obstacle against a wall is in free space and
    #            reads as such.
    #   frenet - the lateral-offset test. Kept to compare the two on the
    #            same track, and used automatically if the map fails to load.
    #
    # boundaries_inflation and max_detect_d_m below apply to `frenet` only.
    on_track_mode: grid

    # [px] Erosion applied to the map before the lookup, at 0.05 m/px. Walls
    # grow by this much, so a return landing just inside one is rejected.
    # 2 px = 10 cm, matching what boundaries_inflation was doing. Raise it if
    # walls still become obstacles; lower it if an obstacle parked against a
    # wall disappears.
    #
    # Tunable live - it re-erodes the map on the spot:
    #   ros2 param set /detect filter_kernel_size 3
    #
    # This is the grid's ONLY parameter. Everything else it needs - resolution,
    # origin, and what counts as free - is read from the map's own yaml, so a
    # grid that behaves oddly is a map problem, not a tuning one.
    filter_kernel_size: 4

    # Minimum number of LiDAR points in a cluster.
    #
    # 4 -> 8. This is the main defence against a wall becoming an obstacle:
    # four returns leaking through the boundary band were enough to publish
    # one, which is why boxes appeared along the walls while driving past.
    #
    # The real obstacle cannot be that small. A 0.50 m cube subtends, at this
    # lidar's 0.25 deg resolution:
    #
    #   1 m -> 112 beams    3 m -> 38    5 m -> 22    9 m -> 12
    #
    # so 8 keeps it out to the 9 m viewing limit with room for grazing angles
    # and dark faces, while rejecting the short fragments a wall leaks.
    min_size_n: 8

    # [m] Floor and ceiling on the MEASURED extent of a cluster, per axis.
    # min_size_m is a floor, not the modelled size: the obstacle's real
    # footprint is settled over time by the tracker (extent_max_m below),
    # because a single frame only ever sees the near faces.
    min_size_m: 0.20
    max_size_m: 0.60

    # Adaptive breakpoint clustering
    lambda_deg: 10.0
    sigma: 0.03
    min_2_points_dist: 0.01

    # Broken-cluster reconnection
    new_cluster_threshold_m: 0.40

    # Maximum detection distance
    max_viewing_distance: 9.0

    # [m] How far inside the track boundary a lidar return must be to count.
    #
    # 0.10 -> 0.15. The track measures 1.05 to 1.85 m wide here, and at 0.10
    # a return within 10 cm of the wall was still accepted - which is inside
    # the combined localisation and lidar error at range, so wall returns
    # leaked in continuously. They cluster into short fragments, and a short
    # fragment is exactly what now becomes a 0.50 m cube.
    #
    # Do not push this much further: the narrowest half-width on this track
    # is 0.33 m, so 0.15 already discards the outer 45% of that side, and a
    # real obstacle parked against the wall has to stay detectable.
    boundaries_inflation: 0.15

    # [m] Hard cap on |d| for a lidar return to be clustered at all.
    #
    # The track boundary is not a good proxy for "close enough to matter".
    # map_no's right boundary reaches 1.47 m around s=17.5, so the wall there
    # is inside the mapped track and boundaries_inflation cannot reject it -
    # the detector was reporting obstacles at d = -1.4 all along it. The
    # planner ignores those anyway (trajectory_threshold 0.6 on the centre),
    # so they were pure cost: an L-shape fit each, and boxes drawn on every
    # wall the car drove past.
    #
    # 0.6 + half of max_size_m, so an obstacle the planner would still
    # consider keeps all of its points.
    max_detect_d_m: 0.90

    # UNITA-specific detection FOV
    # Full Hokuyo scan remains available for localization.
    detect_fov_deg: 220.0

    # Profiling
    measure: false



tracking:
  ros__parameters:
    # [m] Ceiling on an obstacle's footprint. This is where the rule's
    # 50 x 50 cm maximum belongs - as a cap on what may be believed, not as
    # the assumed size of every obstacle.
    extent_max_m: 0.50

    # [m/s] How fast a held extent leaks back down. The tracker keeps the
    # largest extent an obstacle has ever shown, since every frame
    # under-estimates; this stops one bad frame or a mis-associated detection
    # from inflating it permanently. 0.05 sheds 5 cm per second, so a genuine
    # obstacle re-measured at 20 Hz never shrinks, and a phantom fades in a
    # few seconds.
    extent_decay_mps: 0.05

    # How many recent measurements the median position of a STATIC obstacle
    # is taken over. A static obstacle is not moving, but the L-shape fit
    # lands centimetres apart each frame as the viewing angle changes, and
    # the avoidance apex sits on the obstacle's edge - so that jitter went
    # straight into the local path. 10 samples is half a second at 20 Hz.
    static_position_samples: 10

    association_distance: 0.8
    max_missed_frames: 8
    velocity_smoothing: 0.65
    static_speed_threshold: 0.15
    static_min_samples: 6
    publish_static: true
    measure: false

spline_node:
  ros__parameters:
    # [Hz] Was 20, hardcoded. A static obstacle does not need replanning
    # every 5 cm, and this node shares a jetson with the detector, the
    # tracker and a particle filter that is already scan-limited.
    rate_hz: 10.0

    # [s] How long a good path survives a frame the planner could not solve.
    # See the comment in spline_node._loop - the state machine's
    # latest_threshold still decides usability, this only stops a dropout
    # from being published as "there is nothing here".
    #
    # Capped at the state machine's latest_threshold (0.25). Holding longer
    # only republishes paths it will reject as stale - "path is 0.321 s old,
    # threshold 0.25" in the logs was exactly that.
    path_hold_s: 0.25

    # [m] How much wider the other side must be before the planner switches
    # sides. Left and right room are often within a couple of centimetres of
    # each other and the obstacle's measured edges move by about that much
    # between frames, so a bare comparison flipped sides several times a
    # second - and every flip is a completely different path, which the state
    # machine then rejects because the car is not on it.
    side_hysteresis_m: 0.10

    # [m] How far from the raceline an obstacle's near edge has to be before
    # this planner says the line already clears it and publishes nothing.
    #
    # MUST match what the state machine calls a blocked raceline, which is
    # gb_ego_width_m/2 + global_tracking's lateral_width_m. Set to
    # evasion_distance, and that set to 0.10, so the state machine agrees: the raceline
    # counts as blocked exactly when this planner would start moving off it.
    #
    # Getting this wrong in either direction has now been seen on the car.
    # Too low and the planner says "nothing to avoid" while the state machine
    # asks for a path, and the car trails an obstacle forever. Too high and
    # the planner is asked for a path in situations where the raceline is
    # already clear, and the apex it computes lands on the raceline itself -
    # which the state machine then measures against the same obstacle and
    # refuses. Both look identical from outside the car.
    #
    # Three numbers, one threshold:
    #   raceline_clearance_m == evasion_distance
    #                        == gb_ego_width_m/2 + lateral_width_m
    raceline_clearance_m: 0.24

    lookahead: 10.0

    # [m] How far past the FIRST obstacle the corridor may reach to pick up
    # further ones. Obstacles inside it share one held offset instead of being
    # planned one at a time; beyond it the path is planned for what it can hold
    # and the next replan takes the rest.
    corridor_max_len_m: 8.0

    # [m] How far past the PREVIOUS member the next obstacle may sit and still
    # join, scaled by speed like the return leg. 3.0 is exactly what the code
    # did before this was a parameter, so it starts as a no-op - RAISE IT to
    # link obstacles that currently get a swerve-return-swerve each.
    #
    # It is a reachability limit first. Shifting 0.5 m sideways at 3 m/s needs
    # about 6.8 m/s2 of lateral grip over 2 m and 1.7 over 4, so obstacles
    # closer than roughly 3 m cannot be passed at different offsets anyway.
    corridor_link_gap_m: 8.0

    # [m] How far the next obstacle's d may differ FROM THE LEADER'S and still
    # join. Signed, so opposite sides fall out by themselves: -0.10 and -0.15
    # differ by 0.05 and belong together; -0.10 and +0.15 differ by 0.25 and
    # do not. Measured against the leader rather than the previous member, so
    # a corridor cannot walk across the track one small step at a time.
    corridor_link_d_tol_m: 0.30

    # [m] Spacing of the control points holding the offset between the first
    # and last obstacle. Without them a cubic through two equal knots bulges
    # between them - the samples are clipped anyway, but flat control points
    # keep the curvature, and therefore the speed, honest.
    #
    # Floored at 0.2 in code: the control-point loop advances by exactly this,
    # so 0 would never terminate.
    corridor_point_spacing_m: 1.0

    # [m] How far the path passes the obstacle's edge. Squeezed from both
    # sides, and on test_213 the window is only 0.03 m wide.
    #
    # Upper bound, the planner: evasion + boundary_margin has to fit between
    # the obstacle and the track edge. Worked back from the refusals - "right
    # 0.13 m, need 0.20, evasion_distance 0.40" - the tightest obstacle allows
    # 0.33. This track's half-widths measure 0.38 to 0.54 m, so the corridor is
    # barely a metre across and the geometry really is that tight.
    #
    # Lower bound, the state machine: it judges the path free only if
    # evasion - gb_ego_width_m/2 clears lateral_width_m. At 0.4 and 0.1 that
    # needs 0.30, which left no window at all; static_avoidance_planner.yaml
    # drops lateral_width_m to 0.05 so 0.25 suffices.
    #
    # 0.30 sits inside both. Real clearance to the obstacle is 0.30 minus the
    # car's own half-width of 0.14, so 16 cm.
    # 0.30 -> 0.27. With the transform lag fixed the refusals are trustworthy,
    # and they are short by 1 to 4 cm: "left 0.19 m, need 0.20" and "needs
    # d=0.31 m, bound 0.47 less 0.20 margin". 0.27 buys 3 cm on both tests and
    # still clears the state machine's floor, which is
    # gb_ego_width_m/2 + lateral_width_m = 0.20 + 0.05 = 0.25.
    #
    # 0.27 -> 0.24. The obstacle's reported width is honest now - it comes
    # from projecting the fitted box rather than squaring off its longest
    # dimension - so the margin that used to be absorbing that error is free
    # to spend. static_avoidance_planner.yaml drops lateral_width_m to 0.02
    # at the same time, which moves the state machine's floor from 0.25 to
    # 0.22 and leaves 2 cm of slack under this value.
    #
    # Real clearance to the obstacle is this less the car's half width of
    # 0.14, so 10 cm. Do not go under 0.22 without lowering that floor again,
    # and do not lower it to zero: the free check would then have no margin
    # for the centimetre or two of noise in the obstacle's measured edge.
    evasion_distance: 0.24

    trajectory_threshold: 0.6

    # [m] How close the path's centreline may come to the track edge. NOT
    # reducible below the car's half width of 0.14 - at 0.19 the car passes
    # 5 cm from the wall, and 0.15 would put it 1 cm away. That 5 cm is where
    # localisation error lives, so this is the wrong parameter to spend.
    boundary_margin: 0.19

    # [m] Spacing of the published avoidance path.
    #
    # 0.05 -> 0.10. At 0.05 the path is 255 points, and the state machine
    # walks every point of it - _check_on_spline takes a norm over all of
    # them, _check_free_frenet an argmin per obstacle - at its own 80 Hz,
    # every tick. htop had state_machine at 96% of a core and top of the
    # whole machine by accumulated cpu time, ahead of the particle filter.
    # Halving the points halves that.
    #
    # Nothing needs 5 cm. The controller interpolates, the state machine
    # measures distances, and the car covers 5 cm in 25 ms at the speed this
    # branch arms at.
    spline_resolution: 0.10
    measure: false
