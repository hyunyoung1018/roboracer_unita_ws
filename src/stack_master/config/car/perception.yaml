detect:
  # ros__parameters, two underscores. With one, the node matches nothing in
  # this file and silently falls back to its code defaults - no error, no
  # warning, and editing anything here does nothing.
  ros__parameters:
    # [Hz] Detection frequency.
    #
    # 20 because the python detector could not hold 40: it did L-shape
    # rectangle fitting in python on every tick, the jetson saturated, and /tf
    # reached the detector a full second late, which put every obstacle a metre
    # or two behind where it really was.
    #
    # The detector is C++ now and that constraint is probably gone, but it has
    # not been measured. 20 Hz is 50 ms between updates on obstacles that do
    # not move, approached at under 3 m/s - 15 cm of travel - so there is no
    # symptom pushing this up. Before raising it, measure:
    #
    #   ros2 param set /detect measure true
    #   ros2 topic echo /detect/latency
    #
    # That is now seconds per tick, not a rate. Anything near the tick period
    # means the timer cannot keep up. Watch for the "placing obstacles with a
    # X s old transform" warning at the same time - that is the symptom that
    # made this 20 in the first place.
    rate_detect: 20.0

    # Minimum number of LiDAR points in a cluster
    min_size_n: 4

    # Known obstacle side length (0.50 m x 0.50 m x 0.50 m cube)
    min_size_m: 0.50
    max_size_m: 0.60

    # UNIST adaptive breakpoint clustering
    lambda_deg: 10.0
    sigma: 0.03
    min_2_points_dist: 0.01

    # Broken-cluster reconnection
    new_cluster_threshold_m: 0.40

    # Maximum detection distance
    max_viewing_distance: 9.0

    # Frenet track boundary inflation
    boundaries_inflation: 0.10

    # UNITA-specific detection FOV
    # Full Hokuyo scan remains available for localization.
    detect_fov_deg: 220.0

    # Profiling
    measure: false



tracking:
  ros__parameters:
    association_distance: 0.8
    max_missed_frames: 8
    velocity_smoothing: 0.65
    static_speed_threshold: 0.15
    static_min_samples: 6
    publish_static: true
    measure: false

spline_node:
  ros__parameters:
    # [Hz] Was 20, hardcoded. A static obstacle does not need replanning
    # every 5 cm, and this node shares a jetson with the detector, the
    # tracker and a particle filter that is already scan-limited.
    rate_hz: 10.0

    # [s] How long a good path survives a frame the planner could not solve.
    # See the comment in spline_node._loop - the state machine's
    # latest_threshold still decides usability, this only stops a dropout
    # from being published as "there is nothing here".
    path_hold_s: 0.3

    lookahead: 10.0

    # [m] How far the path passes the obstacle's edge. Squeezed from both
    # sides, and on test_213 the window is only 0.03 m wide.
    #
    # Upper bound, the planner: evasion + boundary_margin has to fit between
    # the obstacle and the track edge. Worked back from the refusals - "right
    # 0.13 m, need 0.20, evasion_distance 0.40" - the tightest obstacle allows
    # 0.33. This track's half-widths measure 0.38 to 0.54 m, so the corridor is
    # barely a metre across and the geometry really is that tight.
    #
    # Lower bound, the state machine: it judges the path free only if
    # evasion - gb_ego_width_m/2 clears lateral_width_m. At 0.4 and 0.1 that
    # needs 0.30, which left no window at all; static_avoidance_planner.yaml
    # drops lateral_width_m to 0.05 so 0.25 suffices.
    #
    # 0.30 sits inside both. Real clearance to the obstacle is 0.30 minus the
    # car's own half-width of 0.14, so 16 cm.
    # 0.30 -> 0.27. With the transform lag fixed the refusals are trustworthy,
    # and they are short by 1 to 4 cm: "left 0.19 m, need 0.20" and "needs
    # d=0.31 m, bound 0.47 less 0.20 margin". 0.27 buys 3 cm on both tests and
    # still clears the state machine's floor, which is
    # gb_ego_width_m/2 + lateral_width_m = 0.20 + 0.05 = 0.25.
    #
    # 0.27 -> 0.24. The obstacle's reported width is honest now - it comes
    # from projecting the fitted box rather than squaring off its longest
    # dimension - so the margin that used to be absorbing that error is free
    # to spend. static_avoidance_planner.yaml drops lateral_width_m to 0.02
    # at the same time, which moves the state machine's floor from 0.25 to
    # 0.22 and leaves 2 cm of slack under this value.
    #
    # Real clearance to the obstacle is this less the car's half width of
    # 0.14, so 10 cm. Do not go under 0.22 without lowering that floor again,
    # and do not lower it to zero: the free check would then have no margin
    # for the centimetre or two of noise in the obstacle's measured edge.
    evasion_distance: 0.24

    trajectory_threshold: 0.6

    # [m] How close the path's centreline may come to the track edge. NOT
    # reducible below the car's half width of 0.14 - at 0.20 the car passes
    # 6 cm from the wall, and 0.15 would put it 1 cm away.
    boundary_margin: 0.20
    spline_resolution: 0.10
    measure: false
