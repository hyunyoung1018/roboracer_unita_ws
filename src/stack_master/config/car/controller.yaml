controller_manager:
  ros__parameters:
    # [m] Must match albomb_core.xacro's wheel_base and vesc.yaml's wheelbase -
    # the L1 controller inverts the same bicycle model vesc_to_odom integrates,
    # so a mismatch makes the car steer to a curvature it is not reporting.
    # The controller's built-in default is 0.321; ours is 0.324. All three places
    # move together or none do.
    wheelbase: 0.324
    # [rad] What the steering can actually reach. Derived from the measured
    # servo limits in vesc.yaml: (0.445 - 0.12) / 1.1. The code default is 0.53,
    # for a different car; commanding past our limit is not dangerous, vesc_driver clips
    # it, but the controller would keep reasoning about an angle the wheels
    # never took.
    # Rounded DOWN. The exact limit is (0.445 - 0.12)/1.1 = 0.2954545, and
    # 0.2955 asks for servo 0.11995 against a servo_min of 0.12 - clipped on
    # every full-lock command. A limit rounded the wrong way is not a limit.
    steer_max: 0.2954
    # [m] Lower clip on the L1 lookahead, and in practice the lookahead itself:
    # the raceline is slow enough that the unclipped value sits under this for
    # about three quarters of the lap, so the car drives a near-constant
    # lookahead. That is what makes it steady, and it is why this has to move
    # with speed_scaling - leaving it at 0.7 while the scaling went 0.3 -> 0.4
    # unpinned it and the car started weaving.
    #
    # Paired with the scaling in the map's speed_scaling.yaml. Each row keeps
    # the lookahead pinned for ~75-80% of the lap on test_213:
    #
    #   scale 0.3 -> 0.7    scale 0.4 -> 1.0    scale 0.5 -> 1.05
    #   scale 0.6 -> 1.4    scale 0.7 -> 1.6
    #
    # This does not hold indefinitely. The curvature term goes as v^2, so the
    # lookahead's swing over a lap grows anyway: 0.16 m at scale 0.3, 0.37 m at
    # 0.5, 0.67 m at 0.7. Past about 0.5, weaving is curvature_factor's to fix,
    # not this one's.
    #
    # This value is now the FALLBACK. A map whose speed_scaling.yaml gives every
    # sector a t_clip_min drives the floor per sector instead, and then tuning
    # this in rqt does nothing - tune the sector. Maps without the field (all of
    # them except map_yes) behave exactly as before and use this number.
    t_clip_min: 1.1
    t_clip_max: 8.0
    m_l1: 0.47
    q_l1: -0.2
    speed_lookahead: 0.25
    lat_err_coeff: 1.0
    acc_scaler_for_steer: 1.0
    dec_scaler_for_steer: 1.0
    start_scale_speed: 6.5
    end_scale_speed: 10.0
    downscale_factor: 0.5
    speed_lookahead_for_steer: 0.0
    # Shared/time-trials baseline. Head-to-head overrides these values in
    # head_to_head_controller.yaml so static trailing behavior is unchanged.
    trailing_gap: 2.5
    trailing_vel_gain: 0.25
    trailing_p_gain: 1.35
    trailing_i_gain: 0.0
    trailing_d_gain: 1.0
    blind_trailing_speed: 1.5
    trailing_accel_limit: 1.5
    trailing_decel_limit: 3.0
    trailing_emergency_gap: 0.5
    trailing_rate_limit_enabled: false
    opponent_speed_hold_sec: 0.75
    opponent_speed_valid_min_mps: 0.15
    # [m/s] Upper bound on a believable opponent speed. Without it one bad
    # frame is stored as valid and held for opponent_speed_hold_sec, and
    # trailing accelerates towards an opponent it thinks is doing 269 m/s.
    # Keep equal to the tracker's dynamic_speed_valid_max_mps - the tracker
    # caps /tracking/dynamic_obstacles, this caps the trailing_targets path.
    opponent_speed_valid_max_mps: 6.0
    behavior_timeout_sec: 0.5
    curvature_factor: 0.145
    speed_factor_for_lat_err: 1.0
    speed_factor_for_curvature: 1.0
    KP: 0.8
    KI: 0.0
    KD: 0.05
    heading_error_thres: 10.0
    steer_gain_for_speed: 1.0
    future_constant: 0.05
    AEB_thres: 0.5
    speed_diff_thres: 0.1
    start_speed: 10.0
    start_curvature_factor: 1.5
    # FTG (FTGONLY state) - disparity-extender; all tunables in metres/degrees,
    # live-tunable via rqt. Beam/FOV independent (no beam-count params).
    ftg_debug: true
    ftg_max_lidar_dist: 4.0      # NaN / no-return beams clipped to this [m]
    ftg_max_speed: 2.5           # top speed; speed schedule scales off this [m/s]
    ftg_track_width: 2.0         # returns closer than half this are ignored [m]
    ftg_front_fov_deg: 80.0      # TOTAL front field of view considered [deg] (+-45)
    ftg_smooth_deg: 1.0          # scan smoothing window width [deg]
    ftg_disp_thresh: 0.5         # range jump that counts as a discontinuity [m]
    ftg_bubble_m: 0.3            # safety bubble blown at each disparity [m]
    ftg_steer_ema: 0.0           # steering low-pass 0..1 (0=off, higher=smoother)
    ftg_max_steer: 0.4           # steering command clip [rad]
    save_params: false
