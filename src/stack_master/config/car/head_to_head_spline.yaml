spline_node:
  ros__parameters:
    # test_213 validation from the 2026-08-11 vehicle log:
    #   track width at s~=20.14       1.302 m
    #   obstacle width / d            0.60 m / -0.24 m
    #   usable left-side corridor     ~0.384 m
    #
    # The car is 0.28 m wide.  These values require a 0.37 m corridor:
    #   obstacle side: 0.14 m half-car + 0.05 m clearance = 0.19 m
    #   wall side:     0.14 m half-car + 0.04 m clearance = 0.18 m
    # That fits the measured corridor with ~1.4 cm calculation slack.  A
    # narrower observation still produces an empty path and trailing, rather
    # than forcing an unsafe avoidance manoeuvre.
    #
    # Loaded only by head_to_head.launch.xml. time_trials keeps the existing
    # conservative perception.yaml values (0.24 / 0.20).
    evasion_distance: 0.19
    boundary_margin: 0.18
