state_machine:
  ros__parameters:
    # structural
    rate: 80
    n_loc_wpnts: 80
    timetrials_only: false
    # Nothing declares this today, so it is inert either way - but a car
    # config that says sim: true is a trap for whoever reads it next.
    sim: false
    measure: false
    ot_planner: "lane_change"
    track_length: 1.0
    # geometry / horizons
    # [m] The car's overall width, as the free-space checks model it.
    #
    # 0.4 -> 0.28. 0.28 is measured, and albomb_core.xacro agrees:
    # wheel_track 0.235 + wheel_length 0.04 = 0.275. The old 0.4 was 12 cm of
    # hidden padding, which made every clearance number mean something other
    # than it said. free_dist in _check_free_frenet is now the real gap
    # between the car's side and the obstacle's edge, so the margins on top
    # of it - lateral_width_m, lateral_width_gb_m - are real margins and can
    # be tuned as such.
    #
    # NOTE it cuts both ways. The same check decides whether the RACELINE is
    # blocked, and a narrower car is blocked less often, so lateral_width_gb_m
    # below carries the 6 cm back to keep avoidance triggering when it did.
    gb_ego_width_m: 0.28
    gb_horizon_m: 15.0
    interest_horizon_m: 20.0
    overtaking_horizon_m: 6.9
    emergency_break_horizon: 0.5
    # [m/s] Above this the car trails a static obstacle instead of arming
    # avoidance. Was hardcoded at 3.0, which the raceline exceeds for 30% of
    # the lap once speed_scaling reaches 0.5 - and it exceeds it in the fast
    # sections, which is where an obstacle appears late. Coming out of a
    # corner onto one, the car could not arm, so it trailed, braked, and by
    # the time it was under 3.0 it was too close to swerve. It then sat in
    # front of the obstacle, because a stopped car and a stationary obstacle
    # do not change anything about the situation.
    #
    # 6.0 clears the raceline's top speed at any scaling we would run
    # (5.33 m/s at 0.7), so in practice the gate is off for static obstacles.
    # It is still a gate: it exists so the car does not swerve at a speed the
    # swerve cannot be driven at, and if that ever becomes the failure this
    # is where to bring it back down.
    static_overtake_max_speed_mps: 6.0
    # safety
    volt_threshold: 11.0
    # dynamic (replaces dyn_statemachine_tuner.cfg)
    # [m] Clearance the RACELINE needs from an obstacle before the state
    # machine looks for a way around it. 0.3 -> 0.36: gb_ego_width_m lost
    # 12 cm, i.e. 6 cm per side, and this is what decides when avoidance is
    # needed at all. Without the compensation a narrower car would simply
    # judge the raceline clear and drive at the obstacle.
    lateral_width_gb_m: 0.36
    lateral_width_ot_m: 0.3
    splini_hyst_timer_sec: 0.7
    splini_ttl: 2.0
    pred_splini_ttl: 2.0
    overtaking_ttl_sec: 1.5
    overtake_min_closing_mps: 2.5
    ftg_speed_mps: 0.1
    ftg_timer_sec: 3.0
    ftg_active: false
    force_RACELINE: false
    use_force_trailing: false
