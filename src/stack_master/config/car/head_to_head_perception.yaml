# Head-to-head only overlay for perception.yaml.
#
# Loaded AFTER perception.yaml in head_to_head.launch.xml and consumed by
# h2h_tracking_node, which is a subclass of the shared tracking_node.
# time_trials runs the plain tracking_node and never loads this file, so the
# static obstacle pipeline sees none of it.
tracking:
  ros__parameters:
    # --- moving-target extents ----------------------------------------------
    # The shared tracker holds the largest extent an obstacle has ever shown,
    # capped at extent_max_m (0.50, the rule's maximum for a static box) and
    # shed at extent_decay_mps (0.05 m/s). For a box on the ground that is
    # correct: every frame under-estimates, so the running maximum converges up
    # to the true footprint and stops.
    #
    # It is wrong for the opponent car. The opponent's Frenet extents are not a
    # property of the car, they are a property of the car's yaw relative to the
    # track tangent: a 0.28 x 0.53 m car sitting at 45 deg through a corner
    # projects well over 0.4 m sideways. The running maximum latches that, the
    # 0.05 m/s leak needs six seconds to shed 0.3 m, and after one corner the
    # opponent is permanently believed to be 0.50 m wide.
    #
    # That number is then what decides whether an overtake is possible.
    # opp_prediction copies it into the predicted poses as
    # half_width = max(0.14, (d_left - d_right)/2), the lane-change planner adds
    # its own clearance, and the required room goes from 0.57 m to 0.68 m. On
    # test_213 (half-widths 0.33 to 0.84 m) that is the difference between 53%
    # and 0% of the lap admitting a 6 m evasion corridor.
    #
    # Two separate numbers for a confirmed-moving track, applied only once the
    # tracker has classified it (static_min_samples of history AND not static),
    # so a box is never touched by them:

    # [m] Ceiling on a moving target's footprint. The opponent is a known F1TENTH
    # car: 0.28 m wide, 0.53 m long. 0.34 leaves 6 cm for yaw projection and
    # measurement noise without ever reaching the 0.50 m static allowance.
    dynamic_extent_max_m: 0.34

    # [m/s] How fast a held extent on a moving target leaks back down. 0.05 was
    # tuned so a re-measured static obstacle never shrinks; a moving target is
    # re-measured every frame from a changing angle and needs to shed a bad
    # frame within one, not within six seconds. 0.5 sheds 2.5 cm per 20 Hz tick.
    dynamic_extent_decay_mps: 0.5
