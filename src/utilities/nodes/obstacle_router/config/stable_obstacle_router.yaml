stable_obstacle_router:
  ros__parameters:
    # Provisional values for UNITA at ~20 Hz. Tune from
    # /tracking/classification_debug using real static and moving targets.
    min_std: 0.02
    max_std: 0.04
    min_nb_meas: 8
    history_size: 20
    static_confirm_count: 3
    dynamic_confirm_count: 2
    track_timeout_sec: 1.0
    # Head-to-head has one moving opponent. Transfer its stable class and last
    # credible speed when the shared tracker assigns a replacement ID.
    single_dynamic_opponent: true
    dynamic_reid_timeout_sec: 1.0
    dynamic_reid_max_distance_m: 1.2
    dynamic_reid_max_lateral_m: 0.25
    # Do not guess when the box and operator are similarly plausible matches.
    dynamic_reid_ambiguity_margin_m: 0.20
    dynamic_speed_hold_sec: 0.75
    dynamic_speed_valid_min_mps: 0.15
    # Only this canonical ID leaves /tracking/dynamic_obstacles. Raw tracker IDs
    # remain available in /tracking/classification_debug as tracker_id.
    logical_opponent_id: 1000000
    opponent_width_m: 0.28
    opponent_boundary_margin_m: 0.03
    opponent_forward_min_m: 0.2
    opponent_forward_max_m: 8.0
    # Keep the locked opponent while the car draws level with it. Acquisition
    # still needs 0.2 m ahead; see the node's PARAM_DEFAULTS comment.
    opponent_active_rear_m: -1.5
    # An UNKNOWN track must be seen this many times before the state machine
    # is allowed to trail on it. One-frame tracks were becoming the trailing
    # target with a velocity computed from a single difference.
    min_unknown_samples: 4
    debug: true
