free_scaling_reference_distance_m: 1
is_closed: true
# [m] Clearance the RACELINE needs from an obstacle before the state machine
# looks for a way around it.
#
# 0.15 -> 0.10, so that
#   gb_ego_width_m/2 + this = 0.14 + 0.10 = 0.24 = evasion_distance
#                                                = raceline_clearance_m
# and the raceline counts as blocked exactly when the spline planner would
# start moving off it. At 0.15 the threshold was 0.29 against the planner's
# 0.24, leaving a band where the state machine asked for an avoidance the
# planner answered "nothing to avoid" to - and the car trailed the obstacle.
#
# 0.10 -> 0.16, moving the shared threshold to 0.30. At 0.24 the whole stack
# agreed that a box whose near edge measured 0.27 m off the line was already
# cleared - by 3 cm, on an edge the detector moves by +/-10 cm frame to frame
# (the same box read half widths of 0.12 to 0.25 in one approach) - and the
# car drove through it at speed. 0.16 calls the line blocked inside 0.30 m,
# which is 16 cm of true side clearance instead of 10.
#
# perception.yaml's evasion_distance and raceline_clearance_m move to 0.30
# with this - the three numbers hold together or the trailing-forever band
# comes back. Head-to-head keeps the 0.24 pairing it was tuned on:
# h2h_perception.yaml pins its spline at 0.24 and
# h2h_state_machine_params.yaml overrides this key back to 0.10.
lateral_width_m: 0.16
latest_threshold: 0.1
max_horizon: 20.0
min_horizon: 0.0
on_spline_front_horizon_thres_m: 0.5
on_spline_min_dist_thres_m: 0.5
hyst_timer_sec: 4.0
killing_timer_sec: 10.0
