# No node publishes /planner/recovery/wpnts, so the RECOVERY state can
# never be entered. With this false the state machine stops asking.
# The car still returns to the raceline - the controller pulls it back -
# it just does not plan a path for the return.
enabled: false

free_scaling_reference_distance_m: 1
hyst_timer_sec: 4.0
is_closed: false
killing_timer_sec: 10.0
lateral_width_m: 0.15
latest_threshold: 0.1
max_horizon: 20.0
min_horizon: 0.0
on_spline_front_horizon_thres_m: 0.5
on_spline_min_dist_thres_m: 0.5
